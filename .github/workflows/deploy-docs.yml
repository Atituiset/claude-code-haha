name: Deploy VitePress + mdBook Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mdbook/**'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npm run docs:build

      # peaceiris/actions-mdbook@v2 still runs on the deprecated node20 runtime
      # (node24 only exists on its unreleased main), so install the official
      # binary directly instead.
      - name: Setup mdBook
        run: |
          MDBOOK_VERSION=0.4.44
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version

      - name: Build mdBook
        run: mdbook build mdbook

      - name: Copy mdBook into VitePress dist
        run: cp -r mdbook/book docs/.vitepress/dist/mdbook

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
